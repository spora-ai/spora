{$SERVER_NAME:localhost} {
	root * /app/public

	# Security headers — site-wide (PHP API + /spora/* assets + Mercure)
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		X-XSS-Protection "1; mode=block"
		Referrer-Policy strict-origin-when-cross-origin
	}

	# Subscriber JWT rides in an `__Secure-mercure_access_token` HttpOnly
	# cookie minted by /api/v1/sse/authorize. Do NOT set `anonymous`.
	#
	# The bundled Mercure hub defaults to `mercureAuthorization` (legacy name)
	# — override cookie_name so the hub finds what SseController sets.
	# For plain-HTTP dev, use `mercure_access_token` (no __Secure- prefix).
	mercure {
		publisher_jwt {env.SPORA_MERCURE_JWT_KEY} HS256
		subscriber_jwt {env.SPORA_MERCURE_JWT_KEY} HS256
		cookie_name __Secure-mercure_access_token
	}

	# Spora admin UI
	handle /spora/* {
		root * /app/public
		try_files {path} /spora/index.html
		file_server
	}

	php_server
}
