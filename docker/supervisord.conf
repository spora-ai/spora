[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:spora-web]
command=frankenphp run --config /app/frankenphp.conf --adapter caddyfile
user=www-data
autostart=true
autorestart=true
startsecs=2
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
# stderr_logfile is no-op while redirect_stderr=true; kept for clarity and to survive any future flip of redirect_stderr.
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:spora-worker]
command=php /app/bin/spora worker:run --daemon
user=www-data
autostart=true
autorestart=true
startsecs=3
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
# stderr_logfile is no-op while redirect_stderr=true; kept for clarity and to survive any future flip of redirect_stderr.
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=true
