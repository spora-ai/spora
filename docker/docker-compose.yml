services:
  # spora-init runs once as root to chown the named volumes (caddy_data,
  # caddy_config) that come up root-owned on first mount. After the
  # first successful run, the volumes are correctly owned and the init
  # service is a no-op. The main `spora` service runs as www-data (per
  # `USER www-data` in the Dockerfile) so the long-running process tree
  # is unprivileged.
  spora-init:
    image: alpine:3.19
    user: root
    container_name: spora-init
    restart: "no"
    volumes:
      - spora_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chown -R 33:33 /app/storage /data /config || true
        echo "spora-init: volume ownership fixed"

  spora:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: spora-app
    restart: always
    # Requires host ports 80 and 443 free (Caddy binds both). For a
    # local-only sandbox use `docker compose -p 8081:80 …` with
    # SERVER_NAME=localhost:80 (the .env.local.example default).
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env.local
    depends_on:
      spora-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - spora_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - spora

  mariadb:
    image: mariadb:11
    container_name: spora-db
    restart: always
    env_file:
      - .env.local
    environment:
      MYSQL_ROOT_PASSWORD: ${SPORA_DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${SPORA_DB_NAME:-spora}
      MYSQL_USER: ${SPORA_DB_USER:-spora}
      MYSQL_PASSWORD: ${SPORA_DB_PASSWORD:-sporapassword}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - spora

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: spora-phpmyadmin
    restart: always
    # phpMyAdmin has no auth gate beyond MariaDB credentials — remove this
    # service or firewall 8082 before publishing the stack.
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${SPORA_DB_USER:-spora}
      PMA_PASSWORD: ${SPORA_DB_PASSWORD:-sporapassword}
    networks:
      - spora

volumes:
  spora_storage:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  spora:
    driver: bridge
