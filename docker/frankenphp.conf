{$SERVER_NAME:localhost} {
	root * /app/public

	# Security headers — site-wide (PHP API + /spora/* assets + Mercure)
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		X-XSS-Protection "1; mode=block"
		Referrer-Policy strict-origin-when-cross-origin
	}

	# Mercure hub. The subscriber JWT rides in an
	# `__Secure-mercure_access_token` HttpOnly cookie minted by
	# /api/v1/sse/authorize. Do NOT set `anonymous` here — every private
	# update would otherwise be delivered to any matching subscriber.
	mercure {
		publisher_jwt {env.SPORA_MERCURE_JWT_KEY} HS256
		subscriber_jwt {env.SPORA_MERCURE_JWT_KEY} HS256
	}

	# Spora admin UI
	handle /spora/* {
		root * /app/public
		try_files {path} /spora/index.html
		file_server
	}

	php_server
}
