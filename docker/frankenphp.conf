{$SERVER_NAME:localhost}, http://localhost:80 {
	root * /app/public

	# Security headers — site-wide (PHP API + /spora/* assets + Mercure)
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		X-XSS-Protection "1; mode=block"
		Referrer-Policy strict-origin-when-cross-origin
	}

	# Subscriber JWT rides in an `__Secure-mercure_access_token` HttpOnly
	# cookie minted by /api/v1/sse/authorize. Do NOT set `anonymous`.
	# For plain-HTTP dev, use `mercure_access_token` (no __Secure- prefix).
	mercure {
		# The site-address list above provisions one hub per server (:443 and
		# :80). Mercure 1.0 allows only one unnamed hub per config; the shared
		# name makes both listeners use a single transport, so a publish on one
		# port reaches subscribers on the other.
		name spora
		publisher_jwt {env.SPORA_MERCURE_JWT_KEY} HS256
		subscriber_jwt {env.SPORA_MERCURE_JWT_KEY} HS256
		cookie_name __Secure-mercure_access_token

		# Mercure 1.0 refuses publisher_jwt/subscriber_jwt unless this is set.
		# Sora is still on the 0.x protocol: MercurePublisher and SseController
		# mint `mercure`-claim tokens with no iss/aud/at+jwt, and useRealtime.ts
		# subscribes with `topic=` instead of `match=`. Compatibility mode
		# re-enables the deprecated_claim and deprecated_topic behaviors that
		# the official image is built with. Remove this together with the PHP +
		# frontend migration to RFC 9068 access tokens and `match` parameters.
		protocol_version_compatibility 8
	}

	# Spora admin UI
	handle /spora/* {
		root * /app/public
		try_files {path} /spora/index.html
		file_server
	}

	php_server
}
