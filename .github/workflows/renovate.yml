# Keeps the base images in docker/Dockerfile current.
#
# The runtime tag is pinned to an exact release on purpose. The floating
# `dunglas/frankenphp:1-php8.5-bookworm` moved to a new Caddy and Mercure
# hub underneath a running deployment once already (spora-ai/spora#83) and
# broke every boot, so the tag has to carry which PHP patch it was built on.
# renovate.json keeps that tag pointed at the newest release that still
# matches, and opens a pull request for it.
#
# `RENOVATE_TOKEN` is a personal access token with the `repo` scope. With
# `GITHUB_TOKEN` the workflows on Renovate's own pull requests do not run
# unattended - GitHub asks a maintainer to approve them first:
# https://github.blog/changelog/2026-06-11-bot-created-pull-requests-can-run-workflows-if-approved/
#
# `minimumReleaseAgeBehaviour: timestamp-optional` in renovate.json is what
# makes the runtime tag reachable at all. The Docker registry reports no
# release timestamp for the `dunglas/frankenphp` tags, and the default
# behaviour holds a release with no timestamp pending forever - so the tag
# stayed on 1.13.1 through four releases, three of them security releases,
# and no pull request was ever opened. `timestamp-optional` keeps the
# three-day window for the images that do carry a timestamp (the Composer
# image) and lets the ones that do not through.
name: Renovate

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Self-hosted Renovate has to be told which repository to work on. With
      # the hosted app the installation decides that; here the workflow is
      # already running in the one repository it should touch.
      RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
    steps:
      - name: Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
